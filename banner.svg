<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d0d0f"/>
      <stop offset="1" stop-color="#1a1320"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff5b3a"/>
      <stop offset="0.55" stop-color="#ff3e9d"/>
      <stop offset="1" stop-color="#7c4dff"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <rect width="1200" height="360" fill="url(#bg)"/>

  <!-- Soft glow blob -->
  <circle cx="290" cy="180" r="120" fill="url(#accent)" opacity="0.35" filter="url(#soft)"/>

  <!-- Badge -->
  <g transform="translate(140, 110)">
    <circle cx="80" cy="80" r="78" fill="none" stroke="url(#accent)" stroke-width="3"/>
    <text x="80" y="64" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="700" fill="#fff" letter-spacing="2">SLOP</text>
    <text x="80" y="92" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="700" fill="#fff" letter-spacing="2">COP</text>
    <text x="80" y="120" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11" fill="#ff5b3a" letter-spacing="3">DELVE PATROL</text>
  </g>

  <!-- Wordmark -->
  <g transform="translate(360, 130)">
    <text x="0" y="0" font-family="ui-sans-serif, system-ui, sans-serif" font-size="84" font-weight="800" fill="#ffffff" letter-spacing="-2">slop-cop</text>
    <text x="0" y="44" font-family="ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="500" fill="#cdc7d6" letter-spacing="0">catches AI prose before it ships.</text>
    <text x="0" y="84" font-family="ui-monospace, SFMono-Regular, monospace" font-size="14" fill="#ff5b3a" letter-spacing="2">45 PATTERNS · 150 PHRASES · 33 STRUCTURE TELLS</text>
  </g>

  <!-- Receipt strip -->
  <g transform="translate(140, 290)" font-family="ui-monospace, SFMono-Regular, monospace" font-size="12" fill="#9b94a8">
    <text x="0" y="0">$ scan draft.md</text>
    <text x="180" y="0" fill="#ff3e9d">VERDICT: CRITICAL</text>
    <text x="380" y="0">density 149.71</text>
    <text x="540" y="0">fingerprint: GPT</text>
    <text x="720" y="0" fill="#7c4dff">delve ×4 · tapestry ×1</text>
  </g>
</svg>
